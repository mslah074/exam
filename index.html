<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Baby Academy – Professional Exam Generator</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=DM+Sans:wght@300;400;500;700&display=swap" rel="stylesheet">

<style>

:root{
  --primary:#4b008f;
  --primary2:#6a11cb;
  --accent:#00c9a7;
  --bg:#f4f6fb;
  --card:#ffffff;
  --text:#1f2937;
  --muted:#7c8594;
  --border:#dde3ee;
  --printFont:14px;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:'DM Sans',sans-serif;
  background:var(--bg);
  color:var(--text);
}

/* =======================
   TOP BAR
======================= */

.topbar{
  background:linear-gradient(135deg,var(--primary),var(--primary2));
  color:white;
  padding:20px 30px;
  box-shadow:0 5px 25px rgba(0,0,0,.15);
}

.topbar h1{
  font-family:'Playfair Display',serif;
  font-size:28px;
}

.topbar p{
  opacity:.85;
  margin-top:5px;
}

/* =======================
   LAYOUT
======================= */

.container{
  max-width:1100px;
  margin:30px auto;
  padding:0 20px;
}

.card{
  background:white;
  border-radius:20px;
  padding:24px;
  margin-bottom:25px;
  box-shadow:0 10px 35px rgba(0,0,0,.06);
  border:1px solid var(--border);
}

.card-title{
  font-size:22px;
  color:var(--primary);
  font-weight:700;
  margin-bottom:20px;
}

/* =======================
   FORM
======================= */

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:16px;
}

.field{
  display:flex;
  flex-direction:column;
  gap:6px;
}

.field label{
  font-size:12px;
  color:var(--muted);
  font-weight:700;
  text-transform:uppercase;
}

.field input,
.field textarea,
.field select{
  border:2px solid var(--border);
  border-radius:12px;
  padding:11px 14px;
  font-family:'DM Sans',sans-serif;
  background:#fafcff;
  outline:none;
}

.field input:focus,
.field textarea:focus,
.field select:focus{
  border-color:var(--primary);
  background:white;
}

/* =======================
   BUTTONS
======================= */

.actions{
  display:flex;
  gap:12px;
  flex-wrap:wrap;
}

.btn{
  border:none;
  border-radius:12px;
  padding:12px 18px;
  font-family:'DM Sans',sans-serif;
  font-weight:700;
  cursor:pointer;
  transition:.2s;
}

.btn:hover{
  transform:translateY(-2px);
}

.btn-primary{
  background:linear-gradient(135deg,var(--primary),var(--primary2));
  color:white;
}

.btn-accent{
  background:var(--accent);
  color:white;
}

.btn-danger{
  background:#d63031;
  color:white;
}

.btn-outline{
  background:white;
  color:var(--primary);
  border:2px solid var(--primary);
}

/* =======================
   QUESTIONS
======================= */

.q-card{
  border:1px solid var(--border);
  border-radius:18px;
  overflow:hidden;
  margin-bottom:18px;
  background:white;
}

.q-head{
  background:linear-gradient(135deg,var(--primary),var(--primary2));
  color:white;
  padding:14px 18px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.q-body{
  padding:18px;
}

.q-text{
  width:100%;
  min-height:75px;
  margin-bottom:15px;
}

.choice{
  display:flex;
  align-items:center;
  gap:10px;
  margin-bottom:10px;
}

.choice input[type=text]{
  flex:1;
}

.choice-letter{
  width:34px;
  height:34px;
  border-radius:50%;
  background:var(--primary);
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:700;
}

/* =======================
   MODAL
======================= */

.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.65);
  display:none;
  z-index:999;
  overflow:auto;
  padding:25px;
}

.modal.open{
  display:block;
}

.modal-box{
  max-width:950px;
  margin:auto;
  background:white;
  border-radius:22px;
  overflow:hidden;
}

.modal-controls{
  padding:18px;
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  border-bottom:1px solid #ddd;
}

/* =======================
   EXAM SHEET
======================= */

#exam-sheet{
  background:white;
  padding:40px;
}

.sheet-page{
  min-height:1000px;
  page-break-after:always;
}

.sheet-page:last-child{
  page-break-after:auto;
}

.sheet-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  border-bottom:4px solid var(--primary);
  padding-bottom:20px;
  margin-bottom:25px;
}

.sheet-brand{
  display:flex;
  align-items:center;
  gap:18px;
}

.logo-frame{
  width:105px;
  height:105px;
  background:white;
  border-radius:22px;
  padding:8px;
  border:4px solid #f2f2f2;
  box-shadow:0 8px 30px rgba(0,0,0,.12);
}

.sheet-logo{
  width:100%;
  height:100%;
  object-fit:contain;
  border-radius:16px;
}

.sheet-title-main{
  font-size:34px;
  font-family:'Playfair Display',serif;
  color:var(--primary);
  font-weight:700;
}

.sheet-sub{
  color:var(--muted);
  margin-top:4px;
}

.sheet-exam-title{
  text-align:right;
}

.sheet-exam-title h2{
  font-family:'Playfair Display',serif;
  margin-bottom:5px;
}

.sheet-exam-title p{
  color:var(--accent);
  font-weight:700;
}

/* =======================
   META
======================= */

.meta{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:10px;
  margin-bottom:25px;
}

.meta-box{
  border:1px solid var(--border);
  border-radius:10px;
  padding:10px;
}

.meta-box label{
  display:block;
  font-size:11px;
  color:var(--muted);
  font-weight:700;
  margin-bottom:5px;
}

.meta-box div{
  border-bottom:1px solid #aaa;
  min-height:22px;
  font-weight:600;
}

/* =======================
   INSTRUCTIONS
======================= */

.instructions{
  background:#f6f8fc;
  border-left:5px solid var(--primary);
  padding:14px;
  border-radius:10px;
  margin-bottom:28px;
}

/* =======================
   PRINT QUESTIONS
======================= */

.print-question{
  margin-bottom:24px;
  page-break-inside:avoid;
}

.print-q-title{
  font-size:var(--printFont);
  font-weight:700;
  margin-bottom:10px;
  line-height:1.5;
}

.print-choice{
  display:flex;
  align-items:flex-start;
  gap:10px;
  margin-bottom:9px;
  padding-left:22px;
  font-size:var(--printFont);
}

.print-circle{
  width:24px;
  height:24px;
  border-radius:50%;
  border:2px solid #999;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:12px;
  font-weight:700;
  flex-shrink:0;
}

.correct{
  background:var(--accent);
  color:white;
  border-color:var(--accent);
}

/* =======================
   ANSWER KEY
======================= */

.answer-key{
  margin-top:35px;
  border-top:3px solid var(--primary);
  padding-top:20px;
}

.ak-grid{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  margin-top:15px;
}

.ak-item{
  background:#f2f5ff;
  border:1px solid var(--border);
  padding:8px 12px;
  border-radius:10px;
  font-weight:700;
}

/* =======================
   FOOTER
======================= */

.exam-footer{
  margin-top:45px;
  border-top:2px solid #ddd;
  padding-top:20px;
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:20px;
  font-size:14px;
}

.exam-footer strong{
  color:var(--primary);
}

/* =======================
   PRINT
======================= */

@media print{

  body{
    background:white;
  }

  .topbar,
  .container,
  .modal-controls{
    display:none !important;
  }

  .modal{
    position:static;
    display:block !important;
    background:white;
    padding:0;
  }

  .modal-box{
    max-width:100%;
    box-shadow:none;
  }

  #exam-sheet{
    padding:10px;
  }

}

@media(max-width:700px){

  .sheet-header{
    flex-direction:column;
    align-items:flex-start;
    gap:20px;
  }

  .meta{
    grid-template-columns:1fr 1fr;
  }

  .exam-footer{
    grid-template-columns:1fr;
  }

}

</style>
</head>

<body>

<div class="topbar">
  <h1>Baby Academy – Professional Exam Generator</h1>
  <p>Beautiful printable exams with optimized PDF export</p>
</div>

<div class="container">

  <!-- EXAM INFO -->
  <div class="card">

    <div class="card-title">
      Exam Information
    </div>

    <div class="grid">

      <div class="field">
        <label>Student Name</label>
        <input id="name" type="text">
      </div>

      <div class="field">
        <label>Date</label>
        <input id="date" type="text">
      </div>

      <div class="field">
        <label>Grade / Class</label>
        <input id="grade" type="text">
      </div>

      <div class="field">
        <label>Day</label>
        <input id="day" type="text">
      </div>

      <div class="field">
        <label>Subject</label>
        <input id="subject" type="text">
      </div>

      <div class="field">
        <label>Total Marks</label>
        <input id="marks" type="text">
      </div>

      <div class="field">
        <label>PDF Font Size</label>

        <select id="fontSize">
          <option value="12px">Very Small</option>
          <option value="13px">Small</option>
          <option value="14px" selected>Medium</option>
          <option value="16px">Large</option>
          <option value="18px">Extra Large</option>
        </select>

      </div>

    </div>

  </div>

  <!-- QUESTIONS -->
  <div class="card">

    <div class="actions" style="margin-bottom:20px">

      <button class="btn btn-primary" onclick="addQuestion()">
        + Add Question
      </button>

      <button class="btn btn-accent" onclick="openPreview()">
        Preview & Export PDF
      </button>

      <button class="btn btn-outline" onclick="toggleAK()">
        Show / Hide Answer Key
      </button>

      <button class="btn btn-danger" onclick="clearAll()">
        Clear All
      </button>

    </div>

    <div id="questions"></div>

  </div>

</div>

<!-- MODAL -->
<div class="modal" id="modal">

  <div class="modal-box">

    <div class="modal-controls">

      <button class="btn btn-primary" onclick="window.print()">
        Print / Save PDF
      </button>

      <button class="btn btn-danger" onclick="closePreview()">
        Close
      </button>

    </div>

    <div id="exam-sheet"></div>

  </div>

</div>

let questions = [];
let showAK = false;

const LETTERS = ['A','B','C','D'];

function addQuestion(){

  questions.push({
    text:'',
    numChoices:4,
    choices:['','','',''],
    correct:0
  });

  renderQuestions();

}

function renderQuestions(){

  const wrap = document.getElementById('questions');

  wrap.innerHTML = '';

  questions.forEach((q,index)=>{

    let choicesHTML = '';

    for(let i=0;i<q.numChoices;i++){

      choicesHTML += `

      <div class="choice">

        <div class="choice-letter">
          ${LETTERS[i]}
        </div>

        <input
          type="text"
          value="${q.choices[i]}"
          oninput="questions[${index}].choices[${i}] = this.value"
        >

        <input
          type="radio"
          name="correct-${index}"
          ${q.correct===i ? 'checked' : ''}
          onchange="questions[${index}].correct=${i}"
        >

      </div>

      `;

    }

    wrap.innerHTML += `

    <div class="q-card">

      <div class="q-head">

        <strong>Question ${index+1}</strong>

        <div>

          <select onchange="questions[${index}].numChoices=parseInt(this.value);renderQuestions()">

            <option value="3" ${q.numChoices===3 ? 'selected' : ''}>
              3 Choices
            </option>

            <option value="4" ${q.numChoices===4 ? 'selected' : ''}>
              4 Choices
            </option>

          </select>

          <button class="btn btn-danger"
            onclick="removeQuestion(${index})">
            X
          </button>

        </div>

      </div>

      <div class="q-body">

        <textarea
          class="q-text"
          oninput="questions[${index}].text=this.value"
        >${q.text}</textarea>

        ${choicesHTML}

      </div>

    </div>

    `;

  });

}

function removeQuestion(index){

  questions.splice(index,1);

  renderQuestions();

}

function clearAll(){

  if(confirm('Clear all questions?')){

    questions=[];

    renderQuestions();

  }

}

function toggleAK(){

  showAK = !showAK;

  if(document.getElementById('modal').classList.contains('open')){

    buildSheet();

  }

}

function openPreview(){

  if(questions.length===0){

    alert('Please add questions first');

    return;

  }

  buildSheet();

  document.getElementById('modal').classList.add('open');

}

function closePreview(){

  document.getElementById('modal').classList.remove('open');

}

function esc(text){

  return String(text)
    .replaceAll('&','&amp;')
    .replaceAll('<','&lt;')
    .replaceAll('>','&gt;');

}

function createPageHeader(){

  return `

  <div class="sheet-header">

    <div class="sheet-brand">

      <div class="logo-frame">

        <img
          src="${academyLogo}"
          class="sheet-logo"
          onerror="this.style.display='none'"
        >

      </div>

      <div>

        <div class="sheet-title-main">
          Baby Academy
        </div>

        <div class="sheet-sub">
          Excellence in Early Education
        </div>

      </div>

    </div>

    <div class="sheet-exam-title">

      <h2>
        End-of-Year Exam
      </h2>

      <p>
        ${esc(document.getElementById('subject').value || 'English Language')}
      </p>

    </div>

  </div>

  <div class="meta">

    <div class="meta-box">
      <label>Name</label>
      <div>${esc(document.getElementById('name').value)}</div>
    </div>

    <div class="meta-box">
      <label>Date</label>
      <div>${esc(document.getElementById('date').value)}</div>
    </div>

    <div class="meta-box">
      <label>Grade</label>
      <div>${esc(document.getElementById('grade').value)}</div>
    </div>

    <div class="meta-box">
      <label>Day</label>
      <div>${esc(document.getElementById('day').value)}</div>
    </div>

    <div class="meta-box">
      <label>Marks</label>
      <div>${esc(document.getElementById('marks').value)}</div>
    </div>

  </div>

  <div class="instructions">

    <strong>Instructions:</strong>
    Choose the correct answer carefully.

  </div>

  `;

}

function buildSheet(){

  const fontSize = document.getElementById('fontSize').value;

  document.documentElement.style.setProperty('--printFont',fontSize);

  let html = '';

  const QUESTIONS_PER_PAGE = 8;

  for(let page=0; page<Math.ceil(questions.length / QUESTIONS_PER_PAGE); page++){

    html += `<div class="sheet-page">`;

    html += createPageHeader();

    const start = page * QUESTIONS_PER_PAGE;
    const end = start + QUESTIONS_PER_PAGE;

    const pageQuestions = questions.slice(start,end);

    pageQuestions.forEach((q,localIndex)=>{

      const actualIndex = start + localIndex;

      html += `

      <div class="print-question">

        <div class="print-q-title">

          ${actualIndex+1}. ${esc(q.text)}

        </div>

      `;

      for(let i=0;i<q.numChoices;i++){

        html += `

        <div class="print-choice">

          <div class="print-circle
            ${showAK && q.correct===i ? 'correct' : ''}
          ">
            ${LETTERS[i]}
          </div>

          <div>
            ${esc(q.choices[i])}
          </div>

        </div>

        `;

      }

      html += `</div>`;

    });

    if(page === Math.ceil(questions.length / QUESTIONS_PER_PAGE)-1){

      if(showAK){

        html += `

        <div class="answer-key">

          <h2>
            Answer Key
          </h2>

          <div class="ak-grid">

        `;

        questions.forEach((q,index)=>{

          html += `

          <div class="ak-item">

            Q${index+1}: ${LETTERS[q.correct]}

          </div>

          `;

        });

        html += `

          </div>

        </div>

        `;

      }

      html += `

      <div class="exam-footer">

        <div>
          <strong>Prepared by:</strong><br>
          Ms. Israa Abdullah
        </div>

        <div>
          <strong>Academy Principal:</strong><br>
          Ms. Basma Kamel
        </div>

        <div>
          <strong>Academy Director:</strong><br>
          Ms. Eman Hassan
        </div>

      </div>

      `;

    }

    html += `</div>`;

  }

  document.getElementById('exam-sheet').innerHTML = html;

}

renderQuestions();

</script>

</body>
</html>
